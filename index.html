<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeZe - 中央寄せヘッダー</title>
    <style>
        /* =================================
           CSS スタイル
           ================================= */

        /* 基本的なリセット */
        body {
            margin: 0;
            font-family: sans-serif;
        }

        /* ヘッダー全体 */
        .site-header {
            background-color: #666666; /* 濃い灰色 */
            color: white; /* テキストとアイコンの色 */
            padding: 10px 20px;
            display: flex; /* Flexboxを有効化 */
            align-items: center; /* 垂直方向の中央揃え */
            height: 60px;
            /* ロゴを中央に配置するために、space-between を使用して両端に要素を押しやります */
            justify-content: space-between;
        }

        /* ロゴのコンテナ */
        .logo {
            /* ロゴを中央に配置するため、Flexboxアイテムの中央に配置 */
            /* この設定はヘッダー全体で中央に配置するために重要 */
            flex-grow: 1; /* 残りのスペースを占有 */
            text-align: center; /* テキストを中央揃え */
            /* ロゴがハンバーガーメニューとスペーサーの間に確実に中央に来るように
               ロゴのコンテナの左右マージンを自動調整 */
            margin: 0 auto;
        }
        
        /* ロゴのテキスト */
        .logo h1 {
            font-size: 65px;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
            /* 中央寄せを確実にするため、相対的な位置調整が必要な場合もありますが、
               上記の flex-grow と text-align で十分なはずです。 */
        }

        /* ハンバーガーメニューとスペーサーのコンテナの共通スタイル */
        .menu-icon-container {
            width: 30px; /* アイコンの幅 */
            height: 30px; /* アイコンの高さ */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* スペーサー（右端の空要素） */
        .menu-icon-container.spacer {
            /* メニューアイコンと同じ幅と高さを持ち、ロゴを中央に固定 */
            width: 30px;
            height: 30px;
            visibility: hidden; /* 要素自体は非表示にするが、スペースは確保する */
        }

        /* ハンバーガーメニューアイコンの線 */
        .menu-icon {
            width: 30px;
            height: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            cursor: pointer;
        }

        .menu-icon span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: white;
        }

        /* メインコンテンツの白い領域 */
        .main-content {
            padding: 20px;
            background-color: white;
            min-height: 500px; /* 白い領域を見せるために高さを確保 */
        }
    </style>
</head>
<body>

    <header class="site-header">
        
        <div class="menu-icon-container">
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <div class="logo">
            <h1>ZeZe</h1>
        </div>
        
        <div class="menu-icon-container spacer"></div>
        
    </header>

    <main class="main-content"></main>
    </main>

</body>
</html>
